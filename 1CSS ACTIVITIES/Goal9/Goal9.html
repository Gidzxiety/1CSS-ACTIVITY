<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Display Property</title>

    <style>
        body {
            margin: 15px;
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 90px;
        }

        .box {
            display: inline-block;

            width: 30%;
            height: 460px;

            margin-right: 5px;

            color: white;
            font-size: 32px;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="box red">
        Red Paragraph
    </div>

    <div class="box green">
        Green Paragraph
    </div>

    <div class="box blue">
        Blue Paragraph
    </div>

</body>
</html>
