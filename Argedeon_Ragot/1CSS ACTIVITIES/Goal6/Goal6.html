<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Example</title>

    <style>
        body {
            margin: 0;
            background-color: white;
        }

        .container {
            background-color: purple;
            padding: 40px;
            margin: 30px;
        }

        .content {
            background-color: blue;
            padding: 10px;
        }

        .yellow-text {
            color: yellow;
            font-family: "Times New Roman", serif;
            font-size: 60px;
            margin: 30px;
        }

        .red-box {
            background-color: red;
            color: white;

            font-family: "Times New Roman", serif;
            font-size: 50px;

            padding: 50px;
            margin: 10px 30px 70px 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="content">

            <div class="yellow-text">
                Yellow Text
            </div>

            <div class="red-box">
                White Text
            </div>

            <div class="yellow-text">
                Yellow Text
            </div>

            <div class="red-box">
                White Text
            </div>

        </div>

    </div>

</body>
</html>
