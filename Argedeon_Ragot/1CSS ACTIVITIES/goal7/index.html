<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Combining CSS Selectors</title>

    <link rel="stylesheet" href="design.css">
</head>

<body> 

    <h1>To Do List</h1>

    <h2>Monday</h2>

    <div class="box">

        <p class="done">Do these things today!</p>

        <ul class="list">
            <li>Going to the Gym</li>
            <li class="done">Meditate</li>
            <li class="done">Analyze the Market in Forex atleast 2 hours</li>
        </ul>

    </div>

    <ul>
        <p class="done">Other items</p>
    </ul>

    <p>The best preparation for tomorrow is doing something hard.</p>

</body>

</html>
