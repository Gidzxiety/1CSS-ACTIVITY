<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>

    <style>
        body {
            margin: 0;
            padding: 15px;
        }

        h1 {
            font-size: 80px;
            margin-bottom: 60px;
        }

        .paragraph {
            display: block;

            width: 550px;
            height: 540px;

            color: white;
            font-size: 40px;

            margin-bottom: 40px;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="paragraph red">
        Red Paragraph
    </div>

    <div class="paragraph green">
        Green Paragraph
    </div>

    <div class="paragraph blue">
        Blue Paragraph
    </div>

</body>
</html>
