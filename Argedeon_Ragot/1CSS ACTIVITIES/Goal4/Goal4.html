<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important CSS Properties</title>

    <style>
        body {
            background-color: #6495ED;
            margin: 0;
            padding: 40px 10px;
        }

        h1 {
            color: white;
            font-size: 80px;
        }

        .color {
            color: orangered;
            font-size: 40px;
        }

        .font-size {
            color: white;
            font-size: 100px;
        }

        .font-weight {
            color: white;
            font-weight: bold;
            font-size: 40px;
        }


        .font-family {
            color: white;
            font-family: cursive;
            font-size: 35px;
        }

        .text-align {
            color: white;
            text-align: right;
            font-size: 40px;
        }
    </style>
</head>

<body>

    <h1>Important CSS Properties</h1>

    <p class="color">Color</p>

    <p class="font-size">Font Size</p>

    <p class="font-weight">Font Weight</p>

    <p class="font-family">Font Family</p>

    <p class="text-align">Text Align</p>

</body>
</html>
