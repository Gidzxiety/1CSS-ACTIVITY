<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style>
        body {
            margin: 0;
            padding: 50px 10px;
            background-color: #fff1dc;
        }

        h1 {
            height: 100px;
            margin: 0 0 55px 0;
            padding-left: 0;
            font-family: "Times New Roman", serif;
            font-size: 85px;
            line-height: 100px;
            color: white;
        }

        .hello {
            background-color: #91bd8f;
        }

        .world {
            background-color: #c78b3e;
        }
    </style>
</head>

<body>

    <h1 class="hello">Hello</h1>

    <h1 class="world">World</h1>

</body>
</html>
