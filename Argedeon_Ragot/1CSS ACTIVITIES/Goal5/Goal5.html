<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: white;
        }

  
        .box1 {
            width: 400px;
            height: 400px;

            background-color: #65a6a6;

            border: 10px solid black;

            padding: 20px;

            font-family: "Times New Roman", serif;
            font-size: 28px;
        }

        .box2 {
            width: 355px;
            height: 355px;

            background-color: gold;

            border: 10px solid black;

            margin: 20px;

            position: absolute;
            top: 470px;
            left: 470px;
        }

        .box3 {
            width: 355px;
            height: 355px;

            background-color: #d65f64;

            border: 10px solid black;

            position: absolute;
            top: 900px;
            left: 80px;
        }
    </style>
</head>

<body>

    <div class="box1">
        Lorem ipsum dolor sit amet,
        consectetur adipiscing elit.
        Aliquam at sapien porttitor
        urna elementum lacinia. In id
        magna pulvinar, ultricies
        lorem id, vehicula elit.
        Aliquam eu luctus nisl, vitae
        pellentesque magna. Phasellus
        dolor metus, laoreet ac
        convallis sit amet, efficitur sed
        dolor.
    </div>

    <div class="box2"></div>

    <div class="box3"></div>

</body>
</html>
